<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Budget Tracker</title>
    <!-- Part 4: Link external CSS stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Part 1: Page structure -->
    <header id="main-header">
        <h1>My Budget Tracker</h1>
        <p>Track your income and expenses in one place.</p>
    </header>

    <main>
        <!-- Part 2: The "Add Expense" section -->
        <section id="add-expense-section" class="card">
            <h2>Add Expense</h2>
            
            <div class="input-group">
                <label for="expense-name">Expense Name:</label>
                <input type="text" id="expense-name" placeholder="e.g. Groceries">
            </div>

            <div class="input-group">
                <label for="expense-amount">Amount ($):</label>
                <input type="number" id="expense-amount" placeholder="e.g. 50">
            </div>

            <div class="input-group">
                <label for="expense-category">Category:</label>
                <select id="expense-category">
                    <option value="">Select a category</option>
                    <option value="food">Food</option>
                    <option value="transport">Transport</option>
                    <option value="utilities">Utilities</option>
                    <option value="entertainment">Entertainment</option>
                </select>
            </div>

            <button type="button" id="add-btn">Add Expense</button>
        </section>

        <!-- Part 3: The "Your Expenses" placeholder section -->
        <section id="expense-list-section" class="card">
            <h2>Your Expenses</h2>
            <p class="placeholder-text">No expenses yet</p>
        </section>
    </main>

</body>
</html>
